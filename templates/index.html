        // ✅ Connect to WebSocket using Socket.IO
        const socket = io.connect('http://127.0.0.1:5000');

        socket.on('connect', function () {
            console.log("✅ Connected to WebSocket Server!");
        });

        socket.on('initial_positions', (data) => {
            console.log('Received initial positions');

            const sensors = data.sensors;
            const pcdList = data.pcd_list;

            const colorMap = ["red", "blue", "green", "orange", "purple", "cyan"];
            const sensorColors = {};
            sensors.forEach((sensor, index) => {
                sensorColors[sensor] = colorMap[index % colorMap.length];
            });

            const traces = pcdList.map(pcd => {
                const points = pcd.points;
                const sensorId = pcd.file.split("_")[0];
                const color = sensorColors[sensorId] || "blue";

                return {
                    x: points.map(p => p[0]),
                    y: points.map(p => p[1]),
                    z: points.map(p => p[2]),
                    mode: "markers",
                    type: "scatter3d",
                    marker: { size: 3, color: color },
                    name: pcd.file
                }
            });

            Plotly.newPlot("init-pos-plot", traces, {
                title: "Initial position of the point clouds",
                margin: { l: 0, r: 0, t: 40, b: 0 }
            })
        });

        socket.on('point_cloud', function (data) {
            console.log("📩 Received Dynamic Data Update");

            const traces = [
                {
                    x: data.X.x,
                    y: data.X.y,
                    z: data.X.z,
                    mode: "markers",
                    type: "scatter3d",
                    marker: { size: 3, color: "orange" },
                    name: "X (Updated)"
                }
            ];

            Plotly.react("dynamic-plot", traces, {
                title: "Centroids (Xin & X)",
                responsive: true,
                useResizeHandler: true
            });

            resizePlots();
        });
